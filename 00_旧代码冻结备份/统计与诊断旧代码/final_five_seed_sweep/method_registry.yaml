  run_level_aggregation: "each C6 run's 10 stable-region-portion segment predictions mean-probability-aggregated to 1 run-level prediction before metrics (FINAL_REPORT.md sec C)"
  params: 321950
  action: "REUSE_OK all 5 seeds -- do not rerun"
  notes: "CRITICAL: an older pre-fix version had an evaluation batch-composition label-leakage bug (static graph built by concatenating an entire eval batch before cosine similarity -> homogeneous eval batches let true label leak via graph, inflating val acc to 100% by epoch 1). Fixed by shuffling each Dataset's rows once at construction. All 5 seeds in outputs/dynamic_gin_tgp/unified_protocol/seed<N>/ carry DONE.flag and were independently read: Acc mean=0.8844, std=0.0683 (ddof=1, computed directly from the 5 metrics.csv files, not copied from the report prose) -- matches FINAL_REPORT.md Sec D table exactly. Post-fix confirmed by the sane train_acc 54%->92%% / val curve described in FINAL_REPORT.md's opening note."
  caveat: "high-fidelity reproduction; Protocol A (original protocol) D1 result 95.12% vs paper's 95.71% (-0.59pp), well inside project's 92-98% sanity band. Notable cross-seed variance on Protocol B (std 6.83pp) -- architecture is genuinely seed-sensitive on this task, not a reproduction defect."

